<body>
<style>
:root { --bg:#071a2c; --panel:#0e2a44; --line:#1f4d73; --gold:#ffd166; --text:#eaf6ff; --sub:#9cc7e4; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: radial-gradient(ellipse at top, #0f3a5e 0%, var(--bg) 70%); color: var(--text);
  font-family: 'NanumSquareRound','Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif; overflow: hidden; }
button, input { font-family: inherit; }
#board { display: flex; flex-direction: column; height: 100%; }
header { display: flex; align-items: center; gap: 10px; padding: 12px 20px 8px; flex-wrap: wrap; }
h1 { margin: 0; font-size: clamp(22px, 2.4vw, 36px); font-weight: 800; letter-spacing: -0.5px; }
h1 small { font-size: .5em; color: var(--sub); font-weight: 700; margin-left: 6px; }
.spacer { flex: 1; }
.pill { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18); border-radius: 999px; padding: 8px 14px; font-size: clamp(13px, 1.2vw, 18px); font-weight: 700; }
.tabs { display: flex; gap: 6px; }
.tab, .act { padding: 9px 14px; border-radius: 10px; border: 2px solid var(--line); background: #0c2238; color: var(--text); font-size: clamp(13px, 1.2vw, 17px); font-weight: 800; cursor: pointer; }
.tab.on { background: #23608a; border-color: var(--gold); }
.act.quiz { background: #6b2483; border-color: #c084fc; }
.act.vote { background: #155e75; border-color: #67e8f9; }
#strip { display: grid; grid-template-columns: 1.1fr 1.9fr; gap: 14px; padding: 0 20px 12px; }
.coop { background: rgba(255,255,255,.06); border: 2px solid var(--line); border-radius: 14px; padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; justify-content: center; }
.coop-top { display: flex; justify-content: space-between; font-weight: 800; font-size: clamp(13px, 1.15vw, 18px); }
.coop-bar { height: 14px; background: #10263a; border-radius: 8px; overflow: hidden; margin-top: 4px; }
.coop-bar > div { height: 100%; background: linear-gradient(90deg, #4fd1c5, #7dff9a); transition: width .8s; }
.awards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.award { background: linear-gradient(180deg, rgba(255,209,102,.16), rgba(255,209,102,.05)); border: 2px solid rgba(255,209,102,.45); border-radius: 14px; padding: 10px 12px; min-width: 0; }
.award-t { color: var(--gold); font-weight: 900; font-size: clamp(13px, 1.15vw, 18px); }
.award-n { font-size: clamp(17px, 1.7vw, 27px); font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.award-v { color: var(--sub); font-size: clamp(12px, 1vw, 15px); font-weight: 700; }
main { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; padding: 0 20px 18px; }
@media (max-width: 1250px) { main { grid-template-columns: repeat(2, 1fr); overflow: auto; } #strip { grid-template-columns: 1fr; } }
.board { background: linear-gradient(180deg, rgba(20,56,90,.95), rgba(10,34,58,.95)); border: 2px solid var(--line); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.board h2 { margin: 0 0 8px; font-size: clamp(17px, 1.7vw, 26px); font-weight: 800; }
.rows { display: flex; flex-direction: column; gap: 5px; overflow: hidden; }

<script>
const ONLINE_CONFIG = {
  apiKey: 'AIzaSyAH1RtYF2FCzWx_txawvAFeOtlLYdu7gTo',
  databaseURL: 'https://wonterpark-default-rtdb.asia-southeast1.firebasedatabase.app'
};
const OnlineCore = (function(){
  const AUTH_KEY = 'wonterpark_online_auth_v1';
  const st = { token: null, uid: null, exp: 0, refresh: null, lastError: '' };
  const cfg = () => ONLINE_CONFIG;
  const authBase = () => cfg().authBase || 'https://identitytoolkit.googleapis.com';
  const tokenBase = () => cfg().tokenBase || 'https://securetoken.googleapis.com';
  const dbBase = () => String(cfg().databaseURL || '').replace(/\/+$/, '');
  function enabled(){ return !!(cfg().apiKey && cfg().databaseURL); }
  function cleanCode(s){ return String(s || '').trim().replace(/[.#$\[\]\/\\\s]/g, '').slice(0, 12); }
  function keep(idToken, uid, refresh, expiresIn){
    st.token = idToken; st.uid = uid; st.refresh = refresh; st.exp = Date.now() + (Number(expiresIn) || 3600) * 1000;
    try { localStorage.setItem(AUTH_KEY, JSON.stringify({ uid, refresh })); } catch (e) {}
  }
  let authBusy = null;
  async function auth(){
    if (!enabled()) return null;
    if (st.token && Date.now() < st.exp - 60000) return st.token;
    if (authBusy) return authBusy;                        // 동시에 여러 번 로그인하지 않게
    authBusy = (async () => {
      let saved = null; try { saved = JSON.parse(localStorage.getItem(AUTH_KEY) || 'null'); } catch (e) {}
      const refresh = st.refresh || (saved && saved.refresh);
      try {
        if (refresh) {
          const r = await fetch(`${tokenBase()}/v1/token?key=${cfg().apiKey}`, {
            method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: 'grant_type=refresh_token&refresh_token=' + encodeURIComponent(refresh) });
          if (r.ok) { const j = await r.json(); keep(j.id_token, j.user_id, j.refresh_token, j.expires_in); st.lastError = ''; return st.token; }
        }
        const r = await fetch(`${authBase()}/v1/accounts:signUp?key=${cfg().apiKey}`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ returnSecureToken: true }) });
        const j = await r.json();
        if (!r.ok) throw new Error((j.error && j.error.message) || ('HTTP ' + r.status));
        keep(j.idToken, j.localId, j.refreshToken, j.expiresIn);
        st.lastError = '';
        return st.token;
      } catch (e) { st.lastError = String(e.message || e); return null; }
      finally { authBusy = null; }
    })();
    return authBusy;
  }
  const enc = p => String(p).split('/').filter(Boolean).map(encodeURIComponent).join('/');
  const url = (path, tok) => `${dbBase()}/${enc(path)}.json?auth=${encodeURIComponent(tok)}`;
  const room = (code, sub) => `rooms/${code}/${sub}`;
  async function putPath(path, body){
    const tok = await auth(); if (!tok) return false;
    try {
      const r = await fetch(url(path, tok), { method: 'PUT', body: JSON.stringify(body) });
      if (!r.ok) st.lastError = 'HTTP ' + r.status;
      return r.ok;
    } catch (e) { st.lastError = String(e.message || e); return false; }
  }
  async function getPath(path){
    const tok = await auth(); if (!tok) return undefined;          // undefined = 연결 실패, null = 아직 아무것도 없음
    try { const r = await fetch(url(path, tok)); if (!r.ok) { st.lastError = 'HTTP ' + r.status; return undefined; } return await r.json(); }
    catch (e) { st.lastError = String(e.message || e); return undefined; }
  }
  // 실시간 구독: Firebase REST 스트리밍(EventSource). 끊기면 5초 뒤 새 토큰으로 다시 연결.
  function subscribePath(path, onData){
    let es = null, stopped = false, data = null, retry = null;
    const setAt = (p, val) => {
      const parts = p.split('/').filter(Boolean);
      if (!parts.length) { data = val; return; }
      if (!data || typeof data !== 'object') data = {};
      let o = data;
      for (let i = 0; i < parts.length - 1; i++) { if (!o[parts[i]] || typeof o[parts[i]] !== 'object') o[parts[i]] = {}; o = o[parts[i]]; }
      const last = parts[parts.length - 1];
      if (val === null) delete o[last]; else o[last] = val;
    };
    async function open(){
      if (stopped) return;
      const tok = await auth();
      if (stopped) return;
      if (!tok || typeof EventSource === 'undefined') {             // 스트리밍이 안 되면 10초마다 새로 받아 오기
        if (!tok) onData(data, false);
        else { const d = await getPath(path); if (d !== undefined) data = d; onData(data, d !== undefined); }
        retry = setTimeout(open, 10000); return;
      }
      es = new EventSource(url(path, tok));
      const handle = (kind) => (ev) => {
        try {
          const m = JSON.parse(ev.data); if (!m) return;
          if (kind === 'put') setAt(m.path, m.data);
          else for (const k in (m.data || {})) setAt((m.path === '/' ? '' : m.path) + '/' + k, m.data[k]);
          onData(data, true);
        } catch (e) {}
      };
      es.addEventListener('put', handle('put'));
      es.addEventListener('patch', handle('patch'));
      const reopen = () => { if (es) es.close(); es = null; if (!stopped) { onData(data, false); retry = setTimeout(open, 5000); } };
      es.addEventListener('auth_revoked', () => { st.token = null; reopen(); });
      es.addEventListener('cancel', reopen);
      es.onerror = reopen;
    }
    open();
    return { stop(){ stopped = true; clearTimeout(retry); if (es) es.close(); es = null; } };
  }
  // 예전 이름(학급 기준 경로)도 그대로 쓸 수 있게
  const put = (code, sub, body) => putPath(room(code, sub), body);
  const get = (code, sub) => getPath(room(code, sub));
  function subscribe(code, sub, onData){
    return subscribePath(room(code, sub), (d, ok) => onData(d && typeof d === 'object' ? d : {}, ok));
  }
  // 연결이 안 될 때 원인을 쉬운 말로 알려 준다
  function errorHint(){
    const e = st.lastError || '';
    if (!e) return '';
    if (/ADMIN_ONLY_OPERATION|OPERATION_NOT_ALLOWED/.test(e)) return 'Firebase에서 익명 로그인이 꺼져 있어요 (2단계 확인)';
    if (/API.?KEY|API key/i.test(e)) return 'apiKey 값을 확인해 주세요';
    if (/401|403|Permission/i.test(e)) return '데이터베이스 보안 규칙을 확인해 주세요';
    if (/404/.test(e)) return 'databaseURL 주소를 확인해 주세요';
    if (/fetch|network|Load failed/i.test(e)) return '인터넷 연결을 확인해 주세요';
    return e;
  }
  return { enabled, cleanCode, auth, put, get, subscribe, putPath, getPath, subscribePath, room, errorHint, state: st };
})();
function fmtNum(x){ return String(Math.round(x*100)/100); }
function rint(a,b){ return a+Math.floor(Math.random()*(b-a+1)); }
function pickOf(a){ return a[Math.floor(Math.random()*a.length)]; }
// 원주율 3.14 · 모두 주관식. hard=true면 두 단계 문제도 섞어요.
function makeParkProblem(hard){
  const P=placeName(), PI='(원주율 3.14)';
  const T=[
    ()=>{const d=rint(6,30);return {q:`${P} 옆 원형 대기 공간의 지름이 ${d}m입니다. 둘레에 안전 펜스를 두르려면 펜스가 몇 m 필요할까요? ${PI}`,a:d*3.14,u:'m',e:`${d} × 3.14 = ${fmtNum(d*3.14)}m`,h:'원주 = 지름 × 원주율'};},
    ()=>{const r=rint(3,15);return {q:`${P} 옆 원형 무대의 반지름이 ${r}m입니다. 무대 둘레에 조명 줄을 한 바퀴 두르려면 몇 m가 필요할까요? ${PI}`,a:r*2*3.14,u:'m',e:`지름 ${r} × 2 = ${r*2}, ${r*2} × 3.14 = ${fmtNum(r*2*3.14)}m`,h:'반지름으로 지름을 먼저 구하세요.'};},
    ()=>{const r=rint(2,12);return {q:`${P} 앞 원형 파라솔 그늘의 반지름이 ${r}m입니다. 그늘의 넓이는 몇 m²일까요? ${PI}`,a:r*r*3.14,u:'m²',e:`${r} × ${r} × 3.14 = ${fmtNum(r*r*3.14)}m²`,h:'원의 넓이 = 반지름 × 반지름 × 원주율'};},
    ()=>{const d=rint(2,12)*2;return {q:`${P} 옆 원형 분수대의 지름이 ${d}m입니다. 분수대 바닥에 타일을 깔려면 넓이가 몇 m²일까요? ${PI}`,a:(d/2)*(d/2)*3.14,u:'m²',e:`반지름 ${d/2}m, ${d/2} × ${d/2} × 3.14 = ${fmtNum((d/2)*(d/2)*3.14)}m²`,h:'지름을 2로 나누어 반지름부터 구하세요.'};},
    ()=>{const d=rint(5,25);return {q:`${P} 옆 원형 물놀이장의 둘레가 ${fmtNum(d*3.14)}m입니다. 물놀이장의 지름은 몇 m일까요? ${PI}`,a:d,u:'m',e:`${fmtNum(d*3.14)} ÷ 3.14 = ${d}m`,h:'지름 = 원주 ÷ 원주율'};},
    ()=>{const r=rint(3,12);return {q:`${P} 옆 원형 수영장의 둘레가 ${fmtNum(r*2*3.14)}m입니다. 수영장의 반지름은 몇 m일까요? ${PI}`,a:r,u:'m',e:`${fmtNum(r*2*3.14)} ÷ 3.14 = ${r*2}(지름), ${r*2} ÷ 2 = ${r}m`,h:'원주를 3.14로 나누면 지름이에요. 반지름은 그 절반이에요.'};},
    ()=>{const d=rint(4,10)*10,n=rint(2,5);return {q:`지름이 ${d}cm인 튜브를 ${P} 앞에서 ${n}바퀴 굴렸습니다. 튜브가 이동한 거리는 몇 cm일까요? ${PI}`,a:d*3.14*n,u:'cm',e:`한 바퀴 ${d} × 3.14 = ${fmtNum(d*3.14)}cm, ${n}바퀴 ${fmtNum(d*3.14)} × ${n} = ${fmtNum(d*3.14*n)}cm`,h:'한 바퀴 굴러간 거리는 원주와 같아요.'};}
  ];
  const H=[
    ()=>{const r=rint(2,10);return {q:`${P} 옆 원형 풀의 넓이가 ${fmtNum(r*r*3.14)}m²입니다. 풀의 반지름은 몇 m일까요? ${PI}`,a:r,u:'m',e:`${fmtNum(r*r*3.14)} ÷ 3.14 = ${r*r}, ${r} × ${r} = ${r*r}이므로 ${r}m`,h:'넓이를 3.14로 나눈 수는 반지름 × 반지름이에요.'};},
    ()=>{const r=rint(3,8),w=rint(1,4),R=r+w;return {q:`${P} 옆에 반지름이 ${r}m인 원형 풀이 있습니다. 풀 바깥을 따라 폭 ${w}m의 산책로를 만들었습니다. 산책로의 넓이는 몇 m²일까요? ${PI}`,a:(R*R-r*r)*3.14,u:'m²',e:`(${R} × ${R} × 3.14) − (${r} × ${r} × 3.14) = ${fmtNum(R*R*3.14)} − ${fmtNum(r*r*3.14)} = ${fmtNum((R*R-r*r)*3.14)}m²`,h:`바깥쪽 원의 반지름은 ${r} + ${w}예요. 큰 원 넓이에서 작은 원 넓이를 빼요.`};},
    ()=>{const r=rint(2,7)*2;return {q:`${P} 옆에 반지름이 ${r}m인 반원 모양 공연 무대를 만들었습니다. 무대의 넓이는 몇 m²일까요? ${PI}`,a:r*r*3.14/2,u:'m²',e:`${r} × ${r} × 3.14 ÷ 2 = ${fmtNum(r*r*3.14/2)}m²`,h:'반원의 넓이는 원의 넓이의 절반이에요.'};},
    ()=>{const r=rint(2,5),k=rint(2,4);return {q:`${P} 옆에 반지름이 ${r}m인 원형 풀과 ${r*k}m인 원형 풀이 있습니다. 큰 풀의 넓이는 작은 풀의 넓이의 몇 배일까요?`,a:k*k,u:'배',e:`반지름이 ${k}배이므로 넓이는 ${k} × ${k} = ${k*k}배`,h:`두 풀의 넓이를 각각 구해서 나누어 보세요.`};},
    ()=>{const d=rint(2,4)*8;return {q:`${P} 옆 매점에서 지름이 ${d}cm인 원 모양 피자를 8조각으로 똑같이 나누었습니다. 3조각의 넓이는 몇 cm²일까요? ${PI}`,a:(d/2)*(d/2)*3.14*3/8,u:'cm²',e:`전체 ${d/2} × ${d/2} × 3.14 = ${fmtNum((d/2)*(d/2)*3.14)}cm², 3조각은 ${fmtNum((d/2)*(d/2)*3.14)} × 3 ÷ 8 = ${fmtNum((d/2)*(d/2)*3.14*3/8)}cm²`,h:'전체 원의 넓이를 구한 뒤 8분의 3을 구해요.'};}
  ];
  const t = hard && Math.random()<0.5 ? pickOf(H) : pickOf(T);
  const o=t();
  return {q:o.q,answerValue:Math.round(o.a*100)/100,unit:o.u,explanation:o.e,hint:o.h,mode:'input'};
}

function placeName(){ return '우리 반 워터파크'; }
const METRICS = [
  { k:'assets',  title:'💰 총자산',      fmt:p => '₩' + fmtMoney(p.assets || 0) },
  { k:'sat',     title:'😊 만족도',      fmt:p => (p.sat || 0) + '%' },
  { k:'guests',  title:'🚶 지금 손님 수', fmt:p => fmtMoney(p.guests || 0) + '명' },
  { k:'correct', title:'🔬 연구 (정답 수)', fmt:p => `Lv.${p.lv || 1} · ${p.correct || 0}개${p.extra ? ' +' + p.extra : ''}` }
];
const COOP_GOALS = [
  { id:'v1', k:'total', n:10000, label:'우리 반 누적 방문객 1만 명' }, { id:'c1', k:'correct', n:100, label:'우리 반 정답 100개' },
  { id:'v2', k:'total', n:30000, label:'우리 반 누적 방문객 3만 명' }, { id:'c2', k:'correct', n:300, label:'우리 반 정답 300개' },
  { id:'v3', k:'total', n:80000, label:'우리 반 누적 방문객 8만 명' }, { id:'c3', k:'correct', n:600, label:'우리 반 정답 600개' }
];
let room = '', mode = null, data = {}, last = {}, live = {}, lastOk = false, ownerOk = false, pinResolve = null;
let quizState = null, quizAnsSub = null, quizTimer = null, voteState = null, voteSub = null;
const fmtMoney = n => Number(n || 0).toLocaleString('ko-KR');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const value = (p, k) => k === 'correct' ? (p.correct || 0) * 1000 + (p.extra || 0) : (p[k] || 0);
const players = () => Object.entries(data || {}).map(([id, p]) => ({ id, ...p })).filter(p => p && p.name);
const closeOv = id => { document.getElementById(id).style.display = 'none'; };
const openOv = id => { document.getElementById(id).style.display = 'flex'; };

function startBoard(){
  if (!OnlineCore.enabled()) { document.getElementById('setup-msg').innerHTML = '<span class="warn">아직 온라인 설정(ONLINE_CONFIG)이 비어 있어요.</span>'; return; }
  room = OnlineCore.cleanCode(document.getElementById('room-input').value);
  if (!room) { document.getElementById('room-input').focus(); return; }
  history.replaceState(null, '', '?room=' + encodeURIComponent(room));
  document.getElementById('setup').style.display = 'none';
  document.getElementById('board').style.display = 'flex';
  document.getElementById('room-label').textContent = '학급 코드 ' + room;
  OnlineCore.subscribe(room, 'players', (d, ok) => { data = d || {}; render(ok); if (voteState) renderVote(); });
  OnlineCore.subscribePath(OnlineCore.room(room, 'live'), (d) => { live = (d && typeof d === 'object') ? d : {}; });
  setInterval(() => render(null), 10000);
}
function setMode(m){ mode = m; render(null); }
function render(ok){
  if (ok !== null && ok !== undefined) lastOk = ok;
  const all = players();
  if (mode === null && all.length) { const h = all.filter(p => p.mode === 'hard').length; mode = h > all.length - h ? 'hard' : 'easy'; }
  document.querySelectorAll('#mode-tabs .tab').forEach(b => b.classList.toggle('on', b.dataset.mode === (mode || '')));
  const list = all.filter(p => !mode || p.mode === mode), now = Date.now();
  const liveN = all.filter(p => p.updated && now - p.updated < 60000).length;
  document.getElementById('status').textContent = `${lastOk ? '🟢' : '🔴'} 접속 ${liveN}명 · 참가 ${all.length}명` + (!lastOk && OnlineCore.errorHint() ? ` · ${OnlineCore.errorHint()}` : '');
  // 학급 공동 목표
  let total = 0, correct = 0; for (const p of all) { total += p.total || 0; correct += (p.correct || 0) + (p.extra || 0); }
  const sums = { total, correct };
  document.getElementById('coop').innerHTML = ['total', 'correct'].map(k => {
    const g = COOP_GOALS.filter(x => x.k === k).find(x => sums[k] < x.n);
    if (!g) return `<div class="coop-top"><span>🤝 ${k === 'total' ? '누적 방문객' : '정답'} 목표 모두 달성! 🎉</span><span>${fmtMoney(sums[k])}</span></div>`;
    return `<div><div class="coop-top"><span>🤝 ${g.label}</span><span>${fmtMoney(sums[k])} / ${fmtMoney(g.n)}</span></div><div class="coop-bar"><div style="width:${Math.min(100, sums[k] / g.n * 100)}%"></div></div></div>`;
  }).join('');
  // 오늘의 칭호
  const pick = f => { let best = null, bv = 0; for (const p of all) { const v = f(p); if (v > bv) { bv = v; best = p; } } return best ? { p: best, v: bv } : null; };
  const aw = [
    { t:'😊 만족왕', w: pick(p => (p.guests || 0) >= 20 ? (p.sat || 0) : 0), f: v => '만족 ' + v + '%' },
    { t:'🔬 연구왕', w: pick(p => (p.correct || 0) * 1000 + (p.extra || 0)), f: (v, p) => `정답 ${p.correct || 0}${p.extra ? '+' + p.extra : ''}개` },
    { t:'🚀 성장왕', w: pick(p => p.grow10 || 0), f: v => `최근 10분 +₩${fmtMoney(v)}` },
    { t:'⭐ 인기왕', w: pick(p => p.likes || 0), f: v => `칭찬 스티커 ${v}개` }
  ];
  document.getElementById('awards').innerHTML = aw.map(a => `<div class="award"><div class="award-t">${a.t}</div><div class="award-n">${a.w ? esc(a.w.p.name) : '-'}</div><div class="award-v">${a.w ? a.f(a.w.v, a.w.p) : '아직 없어요'}</div></div>`).join('');
  // 순위표 4개
  document.getElementById('boards').innerHTML = METRICS.map(m => {
    const rows = [...list].sort((a, b) => value(b, m.k) - value(a, m.k)).slice(0, 10);
    return `<section class="board"><h2>${m.title}</h2><div class="rows">${rows.length ? rows.map((p, i) => {
      const key = m.k + p.id, changed = last[key] !== undefined && last[key] !== value(p, m.k);
      last[key] = value(p, m.k);
      const idle = !(p.updated && now - p.updated < 60000);
      return `<div class="row ${i === 0 ? 'top1' : ''} ${changed ? 'flash' : ''} ${idle ? 'idle' : ''}"><span class="no">${['🥇','🥈','🥉'][i] || i + 1}</span>
        <span class="name">${esc(p.name)}${!mode ? ` <span class="mode">${p.mode === 'hard' ? '🔥' : '🌱'}</span>` : ''}</span><span class="val">${m.fmt(p)}</span></div>`;
    }).join('') : '<div class="empty">아직 참가한 학생이 없어요.</div>'}</div></section>`;
  }).join('');
}
function toggleFull(){ if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {}); else document.exitFullscreen(); }

/* ── 선생님 확인 (비밀번호) ── */
function ensureOwner(){
  if (ownerOk) return Promise.resolve(true);
  const saved = localStorage.getItem('wonterpark_pin_' + room);
  const tryPin = async (pin) => {
    const ok = await OnlineCore.putPath('owners/' + room, { uid: (await OnlineCore.auth(), OnlineCore.state.uid), pin });
    if (ok) { ownerOk = true; try { localStorage.setItem('wonterpark_pin_' + room, pin); } catch (e) {} }
    return ok;
  };
  return (async () => {
    if (saved && await tryPin(saved)) return true;
    return new Promise(res => {
      pinResolve = async (pin) => {
        if (!pin || pin.length < 4) { document.getElementById('pin-msg').innerHTML = '<span class="warn">비밀번호는 4자리 이상으로 정해 주세요.</span>'; return; }
        if (await tryPin(pin)) { closeOv('pin-ov'); res(true); }
        else document.getElementById('pin-msg').innerHTML = '<span class="warn">비밀번호가 맞지 않아요. 이 학급에서 처음 정한 비밀번호를 입력해 주세요.</span>' + (OnlineCore.errorHint() && !/규칙/.test(OnlineCore.errorHint()) ? '<br>' + OnlineCore.errorHint() : '');
      };
      document.getElementById('pin-input').value = '';
      openOv('pin-ov'); setTimeout(() => document.getElementById('pin-input').focus(), 50);
      document.querySelector('#pin-ov .btns button:last-child').onclick = () => { closeOv('pin-ov'); res(false); };
    });
  })();
}
function submitPin(){ if (pinResolve) pinResolve(document.getElementById('pin-input').value.trim()); }
document.addEventListener('keydown', e => { if (e.key === 'Enter' && document.getElementById('pin-ov').style.display === 'flex') submitPin(); });

/* ── 깜짝 퀴즈 ── */
function openQuizSetup(){
  if (quizState && quizState.running) { renderQuiz(); openOv('quiz-ov'); return; }
  document.getElementById('quiz-box').innerHTML = `<h2>🎯 깜짝 퀴즈 내기</h2>
    <p>모든 학생 화면에 같은 문제가 동시에 떠요. 60초 안에 먼저 맞힌 순서대로 1등 3배, 2등 2.5배, 3등 2배, 4~5등 1.5배 보상을 받아요.<br>문제는 원의 둘레와 넓이 문제 중에서 자동으로 만들어져요.</p>
    <div class="btns"><button class="primary" onclick="startQuiz(false)">🙂 기본 문제 내기</button><button class="primary" style="background:#6b2483" onclick="startQuiz(true)">🔥 심화 문제 내기</button><button onclick="closeOv('quiz-ov')">닫기</button></div>`;
  openOv('quiz-ov');
}
async function startQuiz(hard){
  if (!(await ensureOwner())) return;
  const p = makeParkProblem(hard), id = 'q' + Date.now().toString(36);
  const quiz = { id, q: p.q, a: p.answerValue, u: p.unit, e: p.explanation, h: p.hint, dur: 60, active: true, start: { '.sv': 'timestamp' } };
  if (!(await OnlineCore.putPath(OnlineCore.room(room, 'live/quiz'), quiz))) { alert('퀴즈를 보내지 못했어요. ' + OnlineCore.errorHint()); return; }
  quizState = { ...quiz, running: true, localStart: Date.now(), solvers: [] };
  if (quizAnsSub) quizAnsSub.stop();
  quizAnsSub = OnlineCore.subscribePath(OnlineCore.room(room, 'quizAns/' + id), (d) => {
    const st = (live.quiz && live.quiz.id === id && live.quiz.start) || 0;
    quizState.solvers = Object.entries(d || {}).map(([pid, x]) => ({ pid, name: x.name, sec: st ? Math.max(0, (x.t - st) / 1000) : null, t: x.t })).sort((a, b) => a.t - b.t);
    renderQuiz();
  });
  clearInterval(quizTimer); quizTimer = setInterval(() => { if (quizState && quizState.running && Date.now() - quizState.localStart >= quizState.dur * 1000) endQuiz(); else renderQuiz(); }, 500);
  renderQuiz(); openOv('quiz-ov');
}
async function endQuiz(){
  if (!quizState || !quizState.running) return;
  quizState.running = false; clearInterval(quizTimer);
  const { running, localStart, solvers, ...q } = quizState;
  await OnlineCore.putPath(OnlineCore.room(room, 'live/quiz'), { ...q, start: (live.quiz && live.quiz.start) || Date.now(), active: false });
  renderQuiz(); openOv('quiz-ov');
}
function renderQuiz(){
  if (!quizState) return;
  const left = Math.max(0, Math.ceil(quizState.dur - (Date.now() - quizState.localStart) / 1000));
  const solvers = quizState.solvers.slice(0, 12).map((s, i) => `<div class="solver"><span>${['🥇','🥈','🥉'][i] || (i + 1) + '.'}</span><span>${esc(s.name)}</span><span>${s.sec !== null ? s.sec.toFixed(1) + '초' : ''}</span></div>`).join('') || '<p>아직 맞힌 학생이 없어요…</p>';
  document.getElementById('quiz-box').innerHTML = `<h2>🎯 선생님 깜짝 퀴즈</h2><div class="qtext">${esc(quizState.q)}</div>
    <div class="qcols"><div>${quizState.running ? `<div class="qtimer">⏱ ${left}초</div><p>학생들이 지금 풀고 있어요. 정답을 맞힌 순서대로 오른쪽에 나와요.</p>` :
      `<div class="answer">정답: ${esc(String(quizState.a))}${esc(quizState.u || '')}<br><span style="font-size:.75em;color:#cfe9f7">${esc(quizState.e || '')}</span></div>`}
    </div><div><h3 style="margin:0 0 8px">✅ 맞힌 학생 ${quizState.solvers.length}명</h3><div class="solvers">${solvers}</div></div></div>
    <div class="btns">${quizState.running ? `<button class="danger" onclick="endQuiz()">지금 끝내고 정답 보기</button>` :
      `<button class="primary" onclick="startQuiz(false)">🙂 기본 문제 하나 더</button><button class="primary" style="background:#6b2483" onclick="startQuiz(true)">🔥 심화 문제 하나 더</button>`}
      <button onclick="closeOv('quiz-ov')">${quizState.running ? '창 숨기기 (퀴즈는 계속돼요)' : '닫기'}</button></div>`;
}

/* ── 베스트 워터파크 투표 ── */
async function openVote(){
  if (voteState) { renderVote(); openOv('vote-ov'); return; }
  document.getElementById('vote-box').innerHTML = `<h2>🗳️ 베스트 워터파크 투표</h2>
    <p>학생들 화면에 [🗳️ 베스트 워터파크 투표] 버튼이 생겨요. 친구 공원을 구경하고 가장 멋진 공원에 한 표씩 줘요. (자기 공원에는 투표할 수 없어요)<br>[투표 마감]을 누르면 1~3등이 발표되고 보상을 받아요.</p>
    <div class="btns"><button class="primary" onclick="startVote()">투표 시작하기</button><button onclick="closeOv('vote-ov')">닫기</button></div>`;
  openOv('vote-ov');
}
async function startVote(){
  if (!(await ensureOwner())) return;
  const id = 'v' + Date.now().toString(36);
  if (!(await OnlineCore.putPath(OnlineCore.room(room, 'live/vote'), { id, open: true }))) { alert('투표를 시작하지 못했어요. ' + OnlineCore.errorHint()); return; }
  voteState = { id, open: true, votes: {}, winners: null };
  if (voteSub) voteSub.stop();
  voteSub = OnlineCore.subscribePath(OnlineCore.room(room, 'votes/' + id), (d) => { if (voteState && voteState.id === id) { voteState.votes = d || {}; renderVote(); } });
  renderVote();
}
function tally(){
  const c = {}; for (const v of Object.values(voteState.votes || {})) if (v && v.target) c[v.target] = (c[v.target] || 0) + 1;
  return Object.entries(c).map(([pid, n]) => ({ pid, name: (data[pid] && data[pid].name) || '(알 수 없음)', votes: n })).sort((a, b) => b.votes - a.votes || String(a.name).localeCompare(String(b.name), 'ko'));
}
async function closeVote(){
  if (!voteState || !voteState.open) return;
  const winners = tally().slice(0, 3);
  await OnlineCore.putPath(OnlineCore.room(room, 'live/vote'), { id: voteState.id, open: false, winners });
  voteState.open = false; voteState.winners = winners; renderVote();
}
function renderVote(){
  if (!voteState) return;
  const t = tally(), max = Math.max(1, ...t.map(x => x.votes)), voters = Object.keys(voteState.votes || {}).length;
  let html = `<h2>🗳️ 베스트 워터파크 투표 ${voteState.open ? '· 진행 중' : '· 결과 발표!'}</h2>`;
  if (voteState.open) {
    html += `<p>투표한 학생 ${voters}명 / 참가 ${players().length}명</p>` + (t.length ? t.slice(0, 10).map(x => `<div class="vbar"><span class="vn">${esc(x.name)}</span><span class="vt"><div style="width:${x.votes / max * 100}%"></div></span><span class="vc">${x.votes}표</span></div>`).join('') : '<p>아직 투표가 없어요…</p>');
    html += `<div class="btns"><button class="danger" onclick="closeVote()">투표 마감하고 결과 발표</button><button onclick="closeOv('vote-ov')">창 숨기기 (투표는 계속돼요)</button></div>`;
  } else {
    const w = voteState.winners || [];
    const pod = (i, cls) => w[i] ? `<div class="pod ${cls}"><div class="m">${['🥇','🥈','🥉'][i]}</div><div class="n">${esc(w[i].name)}</div><div class="c">${w[i].votes}표</div></div>` : '';
    html += w.length ? `<div class="podium">${pod(1, 'p2')}${pod(0, 'p1')}${pod(2, 'p3')}</div>` : '<p>투표한 학생이 없어요.</p>';
    html += `<div class="btns"><button class="primary" onclick="voteState=null;openVote()">새 투표 준비하기</button><button onclick="closeOv('vote-ov')">닫기</button></div>`;
  }
  document.getElementById('vote-box').innerHTML = html;
}
(function(){
  const q = new URLSearchParams(location.search).get('room');
  if (q) { document.getElementById('room-input').value = q; startBoard(); }
  document.getElementById('room-input').addEventListener('keydown', e => { if (e.key === 'Enter') startBoard(); });
})();
</script>
